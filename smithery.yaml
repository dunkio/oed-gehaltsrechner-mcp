# Smithery.ai Configuration for Brutto-Netto & ÖD-Gehaltsrechner MCP Server
# https://smithery.ai
version: 1.0.0
name: brutto-netto-gehaltsrechner
displayName: "Brutto-Netto- & ÖD-Gehaltsrechner Deutschland"
description: "Exakte Gehalts- & Besoldungsberechnungen für Beamte (Bund & 16 Länder) und Tarifbeschäftigte (TVöD, TV-L) sowie universeller Brutto-Netto-Rechner für freie Gehälter nach offiziellem PAP des BMF."
author: ÖD-Infoportal
homepage: https://infos-oeffentlicher-dienst.de
repository: https://github.com/dunkio/oed-gehaltsrechner-mcp
icon: https://infos-oeffentlicher-dienst.de/favicon_io/apple-touch-icon.png
tags:
  - finance
  - public-sector
  - germany
  - salary
  - brutto-netto
  - beamte
  - tvoed

startCommand:
  type: stdio
  configSchema:
    type: object
    properties:
      OED_INFOPORTAL_API_KEY:
        type: string
        description: "Ihr persönlicher API-Key von https://infos-oeffentlicher-dienst.de/api (optional für Free-Tier Tests)"
  command: python
  args:
    - server.py
